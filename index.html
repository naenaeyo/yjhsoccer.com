<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>YJH축구게임</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:#06150c;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden;touch-action:none;min-height:100vh;min-height:100dvh}
canvas{position:fixed;inset:0;width:100%;height:100%}
#m{position:fixed;inset:0;background:linear-gradient(#0c2a18f0,#06150cf8);display:none;flex-direction:column;align-items:center;padding:10px 10px max(18px,env(safe-area-inset-bottom));overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;max-height:100vh;max-height:100dvh;z-index:9;text-align:center;touch-action:pan-y;-webkit-overflow-scrolling:touch}
h1{margin:4px;font-size:26px;color:#ffe14d}h2,h3{margin:6px}
.cols{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cols>div{background:#ffffff16;border-radius:12px;padding:10px;min-width:215px;text-align:left}
input,select{width:100%;padding:7px;margin:3px 0;border-radius:8px;border:0;font-size:15px}
.r{display:flex;align-items:center;gap:6px;margin:5px 0}.r span{flex:1}
.r b,.go,.bt{background:#2ecc71;color:#06210f;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;display:inline-block}
.go{font-size:20px;padding:10px 28px;margin:10px}.bt{margin:4px;padding:9px 16px}
#hud{position:fixed;inset:0;pointer-events:none;display:none;height:100vh;height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
#sb{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#000b;padding:5px 16px;border-radius:20px;font-size:17px;font-weight:700;white-space:nowrap}
#bn{position:absolute;top:30%;width:100%;text-align:center;font-size:40px;font-weight:900;color:#fff;text-shadow:0 3px 8px #000;opacity:0;transition:opacity .3s}
#st{position:absolute;left:max(14px,env(safe-area-inset-left));top:8px;font-size:13px;width:170px;text-shadow:0 1px 3px #000}
.bar{height:9px;background:#0008;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ecc71,#f1c40f)}
#pw{position:absolute;bottom:12px;left:50%;width:150px;margin-left:-75px;visibility:hidden;height:12px}#pi{background:linear-gradient(90deg,#f1c40f,#e74c3c)}
#js{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto;touch-action:none}
/* PC: 키보드 조작 안내, 터치 조이스틱 숨김 */
body.pc #js{display:none!important}body.pc .btn::after{position:absolute;left:50%;right:auto;bottom:-19px;transform:translateX(-50%);width:max-content;max-width:110px;font-size:10px;line-height:1.15;font-weight:900;color:#fff;background:#000b;padding:2px 5px;border-radius:5px;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap;z-index:20}body.pc #bSh::after{content:'SPACE'}body.pc #bPa::after{content:'E'}body.pc #bTh::after{content:'R'}body.pc #bPr::after{content:'X'}body.pc #bTk::after{content:'Q'}body.pc #bRn::after{content:'SHIFT'}body.pc #bSw::after{content:'C'}body.pc #bLf::after{content:'F'}body.pc #bBs::after{content:'B'}body.pc #bFz::after{content:'V'}body.pc #bHd::after{content:'H'}body.pc #bKo::after{content:'ENTER'}body.pc #bTr::after{content:'ENTER'}body.pc #bSb::after{content:'TAB'}body.pc #bDL::after{content:'Z'}body.pc #bDU::after{content:'X'}body.pc #bDR::after{content:'C'}
#kn{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#fffc}
.btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #fff9;color:#fff;font-weight:700;display:none;align-items:center;justify-content:center;width:68px;height:68px;font-size:14px;touch-action:none;text-shadow:0 1px 2px #000}
#bSh,#bTk{right:max(22px,env(safe-area-inset-right));bottom:116px;width:80px;height:80px;font-size:17px}#bSh{background:#e74c3c}#bTk{background:#e67e22}
#bPa,#bPr{right:122px;bottom:30px}#bPa{background:#3498db}#bPr{background:#16a085}
#bTh{right:104px;bottom:108px;background:#8e44ad}
#bRn{display:flex;right:max(22px,env(safe-area-inset-right));bottom:22px;width:84px;height:84px;font-size:17px;background:#f1c40f;color:#000;text-shadow:none}
#bSw{display:flex;right:190px;bottom:104px;background:#34495e}
#bSb{display:flex;right:max(12px,env(safe-area-inset-right));top:8px;width:auto;height:36px;border-radius:10px;padding:0 12px;background:#000a}
#bAd{left:max(14px,env(safe-area-inset-left));top:60px;width:auto;height:36px;border-radius:10px;padding:0 14px;background:#000a;z-index:5}
#tt{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);max-width:62%;background:#000c;padding:8px 14px;border-radius:12px;font-size:14px;font-weight:700;display:none;pointer-events:auto;text-align:center}
#bBs,#bFz{bottom:30px;width:72px;height:72px;z-index:5}#bBs{left:170px;background:#ff5722}#bFz{left:250px;background:#03a9f4}
#bHd{right:270px;bottom:104px;background:#16a085;z-index:5;width:74px;height:74px}
#bLf{right:190px;bottom:104px;background:#27ae60;z-index:5;width:74px;height:74px}
#bKo,#bTr{right:50%;margin-right:-50px;bottom:40px;width:100px;height:100px;background:#e74c3c;font-size:20px;z-index:6}
#gl{position:absolute;top:40px;left:50%;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000}#gl div{background:#000b;padding:2px 12px;border-radius:10px;margin-top:3px;white-space:nowrap}
#bDL,#bDU,#bDR{width:96px;height:96px;background:#e67e22;bottom:30px;font-size:16px}#bDL{right:230px}#bDU{right:126px}#bDR{right:22px}

.formation{position:relative;width:min(92vw,720px);aspect-ratio:2/1;margin:10px auto 14px;border:3px solid #fff;border-radius:10px;background:repeating-linear-gradient(0deg,#299447 0 10%,#268840 10% 20%);overflow:hidden;touch-action:none;user-select:none}
.formation:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffffbd}
.formation:after{content:'';position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid #ffffffbd;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.fm-goal{position:absolute;top:36%;height:28%;width:2.5%;border:2px solid #fff}.fm-goal.left{left:-2px;border-left:0}.fm-goal.right{right:-2px;border-right:0}
.fm-player{position:absolute;z-index:2;transform:translate(-50%,-50%);width:clamp(27px,5vw,38px);height:clamp(27px,5vw,38px);padding:0;border:2px solid #fff;border-radius:50%;background:#c62828;color:white;font-size:11px;font-weight:800;touch-action:none;pointer-events:auto}.fm-player.selected{outline:3px solid #ffe14d;z-index:3}.fm-help{font-size:13px;opacity:.9;margin:5px auto 0}.formation-wrap{width:100%;text-align:center;margin:8px 0 14px}
#nameToggle{position:fixed;right:max(12px,env(safe-area-inset-right));top:8px;z-index:13;pointer-events:auto;border:1px solid #fff8;border-radius:10px;background:#000b;color:#fff;padding:8px 12px;font-weight:700;touch-action:manipulation}#chatToggle{position:fixed;right:max(12px,env(safe-area-inset-right));top:52px;z-index:12;pointer-events:auto;border:1px solid #fff8;border-radius:10px;background:#000b;color:#fff;padding:8px 12px;font-weight:700;display:none;touch-action:manipulation}#voiceToggle{position:fixed;right:max(12px,env(safe-area-inset-right));top:96px;z-index:13;pointer-events:auto;border:1px solid #fff8;border-radius:10px;background:#b33131;color:#fff;padding:8px 12px;font-weight:700;display:none;touch-action:manipulation}#chatPanel{position:fixed;right:max(10px,env(safe-area-inset-right));top:142px;width:min(290px,48vw);height:min(34vh,250px);z-index:12;display:none;flex-direction:column;gap:5px;background:#07110eeF;border:1px solid #ffffff55;border-radius:10px;padding:7px;pointer-events:auto;touch-action:auto}#chatLog{flex:1;overflow-y:auto;text-align:left;font-size:12px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;touch-action:pan-y}#chatRow{display:flex;gap:4px}#chatInput{flex:1;min-width:0;margin:0;padding:7px}#chatSend{border:0;border-radius:7px;background:#2ecc71;color:#06210f;font-weight:700;padding:0 10px}#rot{position:fixed;inset:0;background:#000;display:none;z-index:99;align-items:center;justify-content:center;font-size:22px}
@media(orientation:portrait){#rot{display:flex}}
</style></head><body>

async function claimRoom(code,source){
 if(!db){bn('Firebase 연결이 없습니다');return false}
 const ref=db.ref('rooms/'+code);
 try{
  const team=cleanFirebaseValue(getMyTeamData());
  const res=await ref.transaction(cur=>{
   if(!cur||!cur.host||cur.status!=='waiting'||(cur.guest&&cur.guest.pid))return;
   cur.guest=cleanFirebaseValue({pid:myPid,...team,ready:false,online:true});
   return cleanFirebaseValue(cur);
  },undefined,false);
  if(!res.committed){bn('방이 이미 시작됐거나 만원이에요. 방장이 새 방을 만들어 주세요.',2600);return false}
  roomId=code;roomRef=ref;isHost=false;
  await ref.child('guest').onDisconnect().remove();
  try{await db.ref('public/'+code).remove()}catch(e){console.warn('공개목록 정리 실패',e)}
  enterRoomUI();return true;
 }catch(e){
  console.error(source+' 입장 실패',e);
  M('<h1>입장 실패</h1><p style="white-space:pre-wrap">'+esc(firebaseErrText(e))+'</p><p>방 코드가 맞는지, Firebase의 rooms 읽기/쓰기 권한이 허용됐는지 확인해 주세요.</p><div class=go onclick="'+(source==='공개방'?'listPublicRooms()':'joinCodeUI()')+'">다시 시도</div><div class=go style="background:#e74c3c" onclick=online()>뒤로</div>');return false;
 }
}

function setReady(v){if(!roomRef)return;const path=isHost?'host/ready':'guest/ready';roomRef.child(path).set(!!v);myReady=!!v}

}).catch(e=>{bn('시작 실패');console.error(e)})}
function leaveRoom(){if(!roomRef)return;
const rid=roomId, wasHost=isHost, ref=roomRef;
// cancel onDisconnect handlers we set
try{ ref.onDisconnect().cancel(); }catch(e){}
if(wasHost){
  ref.remove();
  db.ref('public/'+rid).remove();
}else{
  ref.child('guest').remove().then(()=>{
    ref.once('value').then(snap=>{
      const d=snap.val();
      // empty or host marked offline with no guest -> delete
      if(!d || !d.host || (d.host.online===false && !d.guest)){
        ref.remove(); db.ref('public/'+rid).remove();
      }
    });
  });
}
